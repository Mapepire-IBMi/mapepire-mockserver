name: Jar dist CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 8
      uses: actions/setup-java@v6
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven

    - name: Get Maven project version
      # exec-maven-plugin 3.6.1 is the newest release that still runs on Java 8
      run: |
        echo "project_version=$(mvn -q -Dexec.executable="echo" -Dexec.args='${project.version}' --non-recursive org.codehaus.mojo:exec-maven-plugin:3.6.1:exec  --file pom.xml)" >> $GITHUB_ENV
        cat $GITHUB_ENV

    - name: Run tests
      # Runs the standalone tests and the tests that use the Mapepire Java client
      run: mvn -B test --file pom.xml

    - name: Upload test reports
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: test-reports
        path: target/surefire-reports
        if-no-files-found: ignore

    - name: Build with Maven
      # The tests already ran in the previous step
      run: mvn -B package -DskipTests --file pom.xml

    - name: Create staging directory
      run: mkdir -p staging/opt/mapepire-mockserver/lib

    - name: Populate staging directory
      run: |
        mv target/mapepire-mockserver-${{ env.project_version }}-jar-with-dependencies.jar staging/opt/mapepire-mockserver/lib/mapepire-mockserver.jar
        cp README.md staging/opt/mapepire-mockserver/
        cp -r examples staging/opt/mapepire-mockserver/

    - name: Upload dist artifact
      uses: actions/upload-artifact@v7
      id: artifact-upload
      with:
        name: mapepire-mockserver-${{ env.project_version }}
        path: staging/opt/mapepire-mockserver
        if-no-files-found: error
